<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="../Components/SideBar.css">
    <link rel="stylesheet" href="../Css/Calculator.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>

<div class="main">
    <div class="calculator-card">
        <input type="text" id="display" >

        <div class="buttons">

            <button class="btn operator">%</button>
            <button class="btn operator">CE</button>
            <button class="btn operator">C</button>
            <button class="btn operator">
                <i class="bi bi-backspace"></i>
            </button>

            <button class="btn number">7</button>
            <button class="btn number">8</button>
            <button class="btn number">9</button>
            <button class="btn operator">/</button>

            <button class="btn number">4</button>
            <button class="btn number">5</button>
            <button class="btn number">6</button>
            <button class="btn operator">*</button>

            <button class="btn number">1</button>
            <button class="btn number">2</button>
            <button class="btn number">3</button>
            <button class="btn operator">-</button>

            <button class="btn number">+/-</button>
            <button class="btn number">0</button>
            <button class="btn number">.</button>
            <button class="btn operator">+</button>

            <button class="btn equal">=</button>

        </div>

    </div>
</div>

<script>
$(document).ready(function () {

    let expression = "";

    $(".buttons button").click(function () {

        let value = $(this).text().trim();

        // Backspace
        if ($(this).find("i").hasClass("bi-backspace")) {
            expression = expression.slice(0, -1);
            $("#display").val(expression);
            return;
        }

        // Clear All
        if (value === "C") {
            expression = "";
            $("#display").val("");
            return;
        }

        // Clear Entry
        if (value === "CE") {
            expression = expression.replace(/[\d.]+$/, "");
            $("#display").val(expression);
            return;
        }

        // Plus / Minus
        if (value === "+/-") {

            if (expression === "") return;

            let match = expression.match(/(-?\d+\.?\d*)$/);

            if (match) {

                let num = match[0];

                if (num.startsWith("-")) {
                    expression = expression.replace(num, num.substring(1));
                } else {
                    expression = expression.replace(num, "-" + num);
                }

                $("#display").val(expression);
            }

            return;
        }

        // Percentage
        if (value === "%") {
            try {
                expression = (eval(expression) / 100).toString();
                $("#display").val(expression);
            } catch {
                $("#display").val("Error");
                expression = "";
            }
            return;
        }

        // Equal
        if (value === "=") {
            try {
                expression = eval(expression).toString();
                $("#display").val(expression);
            } catch {
                $("#display").val("Error");
                expression = "";
            }
            return;
        }

        // Prevent two operators together
        if (/[+\-*/]/.test(value)) {

            if (expression === "") return;

            if (/[+\-*/]$/.test(expression)) {
                expression = expression.slice(0, -1);
            }
        }

        expression += value;
        $("#display").val(expression);

    });

});
</script>

</body>
</html>
