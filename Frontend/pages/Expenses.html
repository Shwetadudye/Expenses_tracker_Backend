```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Expense</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Expense CSS -->
    <link rel="stylesheet" href="../Css/Expenses.css">

    <!-- Sidebar CSS -->
    <link rel="stylesheet" href="../Components/SideBar.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar"></div>


    <!-- Main Content -->
    <div class="main">

        <div class="expense-box">

            <!-- Page Title -->
            <div class="page-title">

                <div class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                </div>

                <div>
                    <h2>Add Expense</h2>
                    <p>Manage and track your expenses</p>
                </div>

            </div>


            <!-- Expense Grid -->
            <div class="expense-grid">

                <!-- LEFT SIDE -->
                <div class="left-side">

                    <!-- Amount -->
                    <div class="field">

                        <label>Amount</label>

                        <input
                            type="number"
                            id="amount"
                            placeholder="₹ 1000"
                            min="1">

                    </div>


                    <!-- Expense Title -->
                    <div class="field">

                        <label>Expense Title</label>

                        <input
                            type="text"
                            id="title"
                            placeholder="Enter your title">

                    </div>


                    <!-- Date -->
                    <div class="field">

                        <label>Date</label>

                        <input
                            type="date"
                            id="date">

                    </div>


                    <!-- Note -->
                    <div class="field">

                        <label>Note</label>

                        <textarea
                            id="note"
                            placeholder="Write note..."></textarea>

                    </div>

                </div>


                <!-- RIGHT SIDE -->
                <div class="right-side">


                    <!-- SELECT MODE -->
                    <div class="card-box">

                        <h3>Select Mode</h3>

                        <div class="accounts">

                            <!-- Cash -->
                            <div
                                class="card active"
                                data-account="Cash">

                                <i class="fa-solid fa-wallet"></i>

                                <h4>Cash</h4>

                            </div>


                            <!-- Bank -->
                            <div
                                class="card"
                                data-account="Bank">

                                <i class="fa-solid fa-building-columns"></i>

                                <h4>Bank</h4>

                            </div>

                        </div>

                    </div>


                    <!-- EXPENSE CATEGORY -->
                    <div class="card-box">

                        <h3>Expense Category</h3>

                        <div class="categories">


                            <!-- Food -->
                            <div
                                class="category food"
                                data-category="Food">

                                <i class="fa-solid fa-utensils"></i>

                                <span>Food</span>

                            </div>


                            <!-- Travel -->
                            <div
                                class="category travel"
                                data-category="Travel">

                                <i class="fa-solid fa-plane"></i>

                                <span>Travel</span>

                            </div>


                            <!-- Shopping -->
                            <div
                                class="category shopping"
                                data-category="Shopping">

                                <i class="fa-solid fa-bag-shopping"></i>

                                <span>Shopping</span>

                            </div>


                            <!-- Health -->
                            <div
                                class="category health"
                                data-category="Health">

                                <i class="fa-solid fa-kit-medical"></i>

                                <span>Health</span>

                            </div>


                            <!-- Bills -->
                            <div
                                class="category bills"
                                data-category="Bills">

                                <i class="fa-solid fa-file-invoice-dollar"></i>

                                <span>Bills</span>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- SAVE BUTTON -->
            <button class="saveBtn">

                <i class="fa-solid fa-floppy-disk"></i>

                Save Transaction

            </button>

        </div>

    </div>


    <!-- JavaScript -->
    <script>

        $(document).ready(function () {


            /* =========================================
               LOAD SIDEBAR
            ========================================= */

            $("#sidebar").load(
                "../Components/Sidebar.html",
                function (response, status) {

                    if (status === "success") {

                        /* Dashboard */
                        $("#dash").click(function () {
                            window.location.href = "index.html";
                        });


                        /* Income */
                        $("#income").click(function () {
                            window.location.href = "Income.html";
                        });


                        /* Expense */
                        $("#expense").click(function () {
                            window.location.href = "Expenses.html";
                        });


                        /* Transactions */
                        $("#transaction").click(function () {
                            window.location.href = "Transactions.html";
                        });


                        /* Reminder */
                        $("#reminderPage").click(function () {
                            window.location.href = "Reminder.html";
                        });


                        /* Logout */
                        $("#logout").click(function () {

                            localStorage.removeItem("loggedInUser");

                            window.location.href = "login.html";

                        });

                    }

                }
            );


            /* =========================================
               DEFAULT VALUES
            ========================================= */

            let selectedAccount = "Cash";

            let selectedCategory = "";


            /* =========================================
               BACK BUTTON
            ========================================= */

            $(".fa-arrow-left").click(function () {

                history.back();

            });


            /* =========================================
               SELECT ACCOUNT
            ========================================= */

            $(".card").click(function () {

                /* Remove active from all cards */
                $(".card").removeClass("active");


                /* Add active to clicked card */
                $(this).addClass("active");


                /* Get selected account */
                selectedAccount = $(this).data("account");


                console.log(
                    "Selected Account:",
                    selectedAccount
                );

            });


            /* =========================================
               SELECT CATEGORY
            ========================================= */

            $(".category").click(function () {

                /* Remove selected from all categories */
                $(".category").removeClass("selected");


                /* Add selected to clicked category */
                $(this).addClass("selected");


                /* Get selected category */
                selectedCategory = $(this).data("category");


                console.log(
                    "Selected Category:",
                    selectedCategory
                );

            });


            /* =========================================
               SAVE EXPENSE
            ========================================= */

            $(".saveBtn").click(function () {


                /* -------------------------------------
                   GET FORM VALUES
                ------------------------------------- */

                let amount = $("#amount").val();

                let title = $("#title").val().trim();

                let date = $("#date").val();

                let note = $("#note").val().trim();


                /* Convert amount to number */
                amount = Number(amount);


                /* -------------------------------------
                   CHECK LOGIN
                ------------------------------------- */

                const currentUser =
                    JSON.parse(
                        localStorage.getItem("loggedInUser")
                    );


                if (!currentUser) {

                    alert("Please login first");

                    window.location.href = "login.html";

                    return;

                }


                /* -------------------------------------
                   AMOUNT VALIDATION
                ------------------------------------- */

                if (
                    amount === "" ||
                    isNaN(amount) ||
                    amount <= 0
                ) {

                    alert("Amount must be greater than 0");

                    $("#amount").focus();

                    return;

                }


                /* -------------------------------------
                   TITLE VALIDATION
                ------------------------------------- */

                if (title === "") {

                    alert("Enter Title");

                    $("#title").focus();

                    return;

                }


                /* -------------------------------------
                   CATEGORY VALIDATION
                ------------------------------------- */

                if (selectedCategory === "") {

                    alert("Select Category");

                    return;

                }


                /* -------------------------------------
                   DATE VALIDATION
                ------------------------------------- */

                if (date === "") {

                    alert("Select Date");

                    return;

                }


                /* -------------------------------------
                   CREATE EXPENSE OBJECT
                ------------------------------------- */

                const expense = {

                    userId: currentUser.id,

                    amount: amount,

                    title: title,

                    account: selectedAccount,

                    category: selectedCategory,

                    date: date,

                    note: note

                };


                console.log(
                    "Expense:",
                    expense
                );


                /* -------------------------------------
                   POST EXPENSE TO BACKEND
                ------------------------------------- */

                $.ajax({

                    url:
                        "https://expenses-tracker-ccfm.onrender.com/expenses",

                    method: "POST",

                    contentType:
                        "application/json",

                    data:
                        JSON.stringify(expense),


                    /* ---------------------------------
                       SUCCESS
                    --------------------------------- */

                    success: function (response) {

                        alert(
                            "Expense Added Successfully ✅"
                        );
                        window.location.href =
                            "../index.html";

                    },


                    /* ---------------------------------
                       ERROR
                    --------------------------------- */

                    error: function (xhr, status, error) {

                        console.error(
                            "Error:",
                            error
                        );

                        console.error(
                            "Response:",
                            xhr.responseText
                        );


                        alert(
                            "Failed to Add Expense ❌"
                        );

                    }

                });

            });

        });

    </script>

</body>

</html>
