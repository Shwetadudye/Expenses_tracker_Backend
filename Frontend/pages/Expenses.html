<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Expense</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../Css/Expenses.css">
<link rel="stylesheet" href="../Components/SideBar.css">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

</head>

<body>

<div id="sidebar"></div>
   <div class="main">

     <div class="expense-box">

     <div class="page-title">

        <div class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </div>

        <div>
            <h2>Add Expense</h2>
            <p>Manage and track your expenses</p>
        </div>

    </div>

    <div class="expense-grid">
        <div class="left-side">
            <div class="field">
                <label>Amount</label>
                <input type="number" id="amount" placeholder="₹ 1000">
            </div>

            <div class="field">
                <label>Expense Title</label>
                <input type="text" id="title" placeholder="Enter your title">
            </div>

            <div class="field">
                <label>Date</label>
                <input type="date" id="date">
            </div>

            <div class="field">
                <label>Note</label>
                <textarea id="note" placeholder="Write note..."></textarea>
            </div>

        </div>
        <div class="right-side">

            <div class="card-box">
                <h3>Select Mode</h3>
                <div class="accounts">

                    <div class="card active" data-account="Cash">
                        <i class="fa-solid fa-wallet"></i>
                        <h4>Cash</h4>
            
                    </div>

                    <div class="card" data-account="Bank">
                        <i class="fa-solid fa-building-columns"></i>
                        <h4>Bank</h4>
                    </div>

                </div>

            </div>

            <div class="card-box">
                <h3>Expense Category</h3>
                <div class="categories">

                    <div class="category food" data-category="Food">
                        <i class="fa-solid fa-utensils"></i>
                        <span>Food</span>
                    </div>

                    <div class="category travel" data-category="Travel">
                        <i class="fa-solid fa-plane"></i>
                        <span>Travel</span>
                    </div>

                    <div class="category shopping" data-category="Shopping">
                        <i class="fa-solid fa-bag-shopping"></i>
                        <span>Shopping</span>
                    </div>

                    <div class="category health" data-category="Health">
                        <i class="fa-solid fa-kit-medical"></i>
                        <span>Health</span>
                    </div>

                    <div class="category bills" data-category="Bills">
                        <i class="fa-solid fa-file-invoice-dollar"></i>
                        <span>Bills</span>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <button class="saveBtn">
        <i class="fa-solid fa-floppy-disk"></i>
        Save Transaction
    </button>

</div>

</div>
</body>

<script>
    $(document).ready(function(){

   $("#sidebar").load("../Components/Sidebar.html", function(response,status){
        if(status === "success"){

            $("#dash").click(()=>location.href="Home.html");
            $("#income").click(()=>location.href="Income.html");
            $("#expense").click(()=>location.href="Expenses.html");
            $("#transaction").click(()=>location.href="Transactions.html");
            $("#reminderPage").click(()=>location.href="Reminder.html");
            
           
            $("#logout").click(function(){
                localStorage.removeItem("loggedInUser");
                location.href="login.html";
            });

        }

    });

    let selectedAccount = "Cash";
    let selectedCategory = "";

    $(".fa-arrow-left").click(function(){
        history.back();
    });
    $(".card").click(function () {
       $(".card").removeClass("active");
        $(this).addClass("active");
        selectedAccount = $(this).data("account");
        console.log(selectedAccount);

});
   $(".category").click(function(){
    $(".category").removeClass("selected");
    $(this).addClass("selected");
    selectedCategory = $(this).data("category");
});
    $(".saveBtn").click(function(){
        let amount = $("#amount").val();
        amount = Number(amount);

if (isNaN(amount) || amount <= 0) {
    alert("Amount must be greater than 0");
    $("#amount").focus();
    return;
}
        let title = $("#title").val();
        let date = $("#date").val();
        let note = $("#note").val();

        if(title==""){
            alert("Enter Title");
            return;
        }

        if(selectedCategory==""){
            alert("Select Category");
            return;
        }

        if(date==""){
            alert("Select Date");
            return;
        }

    const currentUser =JSON.parse(localStorage.getItem("loggedInUser"));

let expense={
    userId:currentUser.id,
    amount:amount,
    title:title,
    account:selectedAccount,
    category:selectedCategory,
    date:date,
    note:note

};
        alert("Expense Saved Successfully ✅");

 $.ajax({
    url:"https://expenses-tracker-ccfm.onrender.com/expenses",
    method:"POST",
    contentType:"application/json",
    data:JSON.stringify(expense),

    success:function(){
       alert("Expense Added Successfully ✅");
        window.location.href="Home.html";
    },
    error:function(){
        alert("Failed to Add Expense");
    }
});
    });

});
</script>
</html>
