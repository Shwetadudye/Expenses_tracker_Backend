<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Income</title>

<link rel="stylesheet" href="../Css/Income.css">
<link rel="stylesheet" href="../Components/SideBar.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>
    <div id="sidebar"></div>
    <div class="main">
        <div class="income-box">
            <div class="page-title">
                <div class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
        </div>

        <div>
            <h2>Add Monthly Income</h2>
            <p>Manage and track your income</p>
        </div>

    </div>

    <div class="income-grid">
        <div class="left-side">
            <div class="field">
                <label>Amount</label>
                <input
                type="number"
                id="amount"
                placeholder="₹1200000"
                >
            </div>
            <div class="field">
                <label>Income Title</label>
                <input
                type="text"
                id="title"
                placeholder="Salary, Freelance...">
            </div>
            <div class="field">
                <label>Date</label>
                <input
                type="date"
                id="date">
            </div>
            <div class="field">
                <label>Note</label>
                <textarea
                id="note"
                placeholder="Write note..."></textarea>
            </div>
        </div>
        <div class="right-side">
            <div class="card-box">
                <h3>Source Mode</h3>
                <div class="account">
                    <div class="account-card active" data-account="Cash">
                        <i class="fa-solid fa-wallet"></i>
                        <h4>Cash</h4>
                        <p>Wallet</p>
                    </div>

                <div class="account-card" data-account="Bank">
                        <i class="fa-solid fa-building-columns"></i>
                        <h4>Bank</h4>
                        <p>Account</p>
                    </div>
                </div>
            </div>
            <div class="card-box">
                <h3>Income Category</h3>
                <div class="category">
                    <div class="icon green" data-category="Salary">
                        <i class="fa-solid fa-briefcase"></i>
                        <span>Salary</span>
                    </div>

                    <div class="icon blue" data-category="Freelance">
                        <i class="fa-solid fa-laptop"></i>
                        <span>Freelance</span>
                    </div>

                    <div class="icon sky" data-category="Investment">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Investment</span>
                    </div>

                    <div class="icon purple" data-category="Gift">
                        <i class="fa-solid fa-gift"></i>
                        <span>Gift</span>
                    </div>

                    <div class="icon orange" data-category="Bonus">
                        <i class="fa-solid fa-coins"></i>
                        <span>Bonus</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <button id="saveIncome">
        <i class="fa-solid fa-floppy-disk"></i>
        Save Income
    </button>
</div>
</div>
</div>
</body>
<script>
$(document).ready(function(){
   $("#sidebar").load("../Components/Sidebar.html", function(response,status){
        if(status === "success"){
            $("#dash").click(()=>location.href="../index.html");
            $("#income").click(()=>location.href="Income.html");
            $("#expense").click(()=>location.href="Expenses.html");
            $("#transaction").click(()=>location.href="Transactions.html");
            $("#reminderPage").click(()=>location.href="Reminder.html");

            $("#logout").click(function(){
                localStorage.removeItem("loggedInUser");
                location.href="login.html";
            });
        }
    });

    let selectedAccount = "Cash";
    let selectedCategory = "";
    $(".fa-arrow-left").click(function(){
        history.back();
    });

   $(".account-card").click(function(){
    $(".account-card").removeClass("active");
    $(this).addClass("active");
    selectedAccount=$(this).data("account");
});

    $(".icon").click(function(){
        $(".icon").removeClass("selected");
        $(this).addClass("selected");
        selectedCategory=$(this).data("category");
    });

    $("#saveIncome").click(function(){
        let amount=$("#amount").val();
        let title=$("#title").val();
        let date=$("#date").val();
        let note=$("#note").val();

         if(amount==""){
            alert("please enter your amount");
            return;
        }
        if(title==""){
            alert("Enter Title");
            return;
        }

        if(selectedCategory==""){
            alert("Select Income Category");
            return;
        }

        if(date==""){
            alert("Select Date");
            return;
        }

        const currentUser =JSON.parse(localStorage.getItem("loggedInUser"));
        let income={
            
            userId:currentUser.id,
            amount:amount,
            title:title,
            account:selectedAccount,
            category:selectedCategory,
            date:date,
            note:note
        };
        $.ajax({
            url:"https://expenses-tracker-ccfm.onrender.com/income",
            method:"POST",
            contentType:"application/json",
            data:JSON.stringify(income),
            success:function(){
                alert("Income Added Successfully ✅");
                location.href="../index.html";
            },
            error:function(){
                alert("Failed to Add Income");
            }
        });

    });

});

</script>
</html>
