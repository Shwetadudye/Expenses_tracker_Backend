<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
      <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
</head>
<body>
      <form>
      <label for="email">Email</label>
      <input type="text" name="User_Email" id="useremail" placeholder="Please enter your email">
      <span id="email_error" style="color:red"></span>

      <label for="password">Password</label>
      <input type="password" name="User_Password" id="userpassword" placeholder="Enter your password">
      <span id="password_error" style="color:red"></span>

      <button type="submit" value="Login" class="btn" id="login_btn">LOGIN</button>
    
      <div class="Signup_link">
        <p> Don't have an account?</p>
        <a href="Signup.html">Please Signup</a>
      </div>
    </form>
</body>
 <script>
    $(function () {
      const API = `https://expenses-tracker-ccfm.onrender.com/users`;

      // this is for get the data  server to client [GET]

      $('form').submit(function (e) {
        e.preventDefault();
        const email = $('#useremail').val();
        const password = $('#userpassword').val();
        
         $("#email_error").text("");
        $("#password_error").text("");

        // Validation
        if (email === "") {
            $("#email_error").text("Please enter email.");
            return;
        }

        if (password === "") {
            $("#password_error").text("Please enter password.");
            return;
        }


        $.ajax({
          url: API,
          method: 'GET',
          success: function (users) {
             // Find user by email
                const user = users.find(u => u.email === email);

                // Email not found
                if (!user) {
                    $("#email_error").text("Email is not registered.");
                    return;
                }

                // Password incorrect
                if (user.password !== password) {
                    $("#password_error").text("Incorrect password.");
                    return;
                }
            alert('LOGIN SUCEESSFULLY');
            console.log(user);
          },
          error: function (err) {
            console.log('error', err);
            alert(" failed❌");
          },
          complete: function () {
            console.log('done');
          },
        });
      });
    });
  </script>

</html>
