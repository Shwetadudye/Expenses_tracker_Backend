<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<link rel="stylesheet" href="../Css/Profile.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<div class="container">
    <div class="top">
    <i class="fa-solid fa-arrow-left" id="back"></i>
    <h2>My Profile</h2>
</div>
    <div class="welcome-card">
        <h2>👋 Welcome,</h2>
        <h1 id="name">Shweta Dudye</h1>
    </div>

    <div class="card">
        <h3><i class="fa-solid fa-user"></i> Profile</h3>

        <p><i class="fa-solid fa-envelope"></i> <span id="email"></span></p>

        <p><i class="fa-solid fa-phone"></i> <span id="phone"></span></p>
    </div>

    <div class="card income">
        <h3>💰 Total Income</h3>
        <h2 id="income">₹0</h2>
    </div>

    <div class="card expense">
        <h3>💸 Total Expense</h3>
        <h2 id="expense">₹0</h2>
    </div>

    
    <button id="editProfile">Edit Profile</button>
    
    <button id="deleteAccount">
        Delete Account
    </button>
    
    <button id="logout">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
    </button>
</div>

</body>

<script>
    const userId = localStorage.getItem("userId");

$.get("https://expenses-tracker-ccfm.onrender.com/users/" + userId,function(user){

    $("#name").text(user.name);
    $("#email").text(user.email);
    $("#phone").text(user.phone);

});

$.when(

    $.get("https://expenses-tracker-ccfm.onrender.com/income"),
    $.get("https://expenses-tracker-ccfm.onrender.com/expenses")

).done(function(incomeRes,expenseRes){

    let income = incomeRes[0];
    let expense = expenseRes[0];

    let totalIncome = 0;
    let totalExpense = 0;

    const currentUser =
JSON.parse(localStorage.getItem("loggedInUser"));

income
.filter(item=>item.userId==currentUser.id)
.forEach(function(item){

    totalIncome += Number(item.amount);

});

   expense
.filter(item=>item.userId==currentUser.id)
.forEach(function(item){

    totalExpense += Number(item.amount);

});

    $("#income").text("₹"+totalIncome);
    $("#expense").text("₹"+totalExpense);

});

$("#logout").click(function(){

    localStorage.removeItem("userId");

    window.location.href="login.html";

});

$("#back").click(function(){
    window.location.href = "Home.html";
});

$("#editProfile").click(function(){

    let newName = prompt("Enter Name",$("#name").text());
    let newPhone = prompt("Enter Phone",$("#phone").text());

    $.ajax({

        url:"https://expenses-tracker-ccfm.onrender.com/users/"+userId,
        method:"PUT",

        contentType:"application/json",

        data:JSON.stringify({

            id:userId,
            name:newName,
            email:$("#email").text(),
            phone:newPhone

        }),

        success:function(){

            alert("Profile Updated");

            location.reload();

        }

    });

});

$("#deleteAccount").click(function(){

if(confirm("Delete Your Account?")){

$.ajax({

url:"https://expenses-tracker-ccfm.onrender.com/users/"+userId,

method:"DELETE",

success:function(){

localStorage.removeItem("userId");

alert("Account Deleted");

window.location.href="Signup.html";

}

});

}

});
</script>
</html>
