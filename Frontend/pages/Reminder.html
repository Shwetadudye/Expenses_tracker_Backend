<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../Css/Reminder.css">
    <link rel="stylesheet" href="../Components/SideBar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
</head>
<body>
    <div id="sidebar"></div>
    <div class="container">
        <div class="form-card">
            <h2>
                <i class="bi bi-calendar-event-fill"></i>
                Add Reminder</h2>

        <form>
          <div class="field">
    <label>Reminder</label>
    <input id="reminder" type="text" placeholder="Enter reminder...">
</div>

<div class="field dateField">
    <label>Date</label>
    <input id="date" type="date">
</div>

<button type="submit">
    <i class="bi bi-plus-circle"></i>
    Add Reminder
</button>
        </form>

    </div>

    <div class="table-card">
        <h2>
            <i class="bi bi-list-check"></i>
            Reminder List</h2>
        <div id="reminderData"></div>

    </div>
</div>
</body>
<script>
$(document).ready(function () {

    $("#sidebar").load("../Components/Sidebar.html", function (response, status) {

        if (status === "success") {

            $("#dash").click(() => location.href = "../index.html");
            $("#income").click(() => location.href = "Income.html");
            $("#expense").click(() => location.href = "Expenses.html");
            $("#transaction").click(() => location.href = "Transactions.html");
            $("#reminderPage").click(() => location.href = "Reminder.html");
            $("#calculator").click(() => location.href = "Calculator.html");

            $("#logout").click(function () {
                localStorage.removeItem("loggedInUser");
                location.href = "login.html";
            });

        }

    });

    const API = "https://expenses-tracker-ccfm.onrender.com/reminders";
    const currentUser = JSON.parse(localStorage.getItem("loggedInUser"));

    let editId = null;

    // ================= ADD / UPDATE ===================

    $("form").submit(function (e) {

        e.preventDefault();

        const reminder = $("#reminder").val().trim();
        const reminderDate = $("#date").val();
        const repeat = $("#repeat").val();

        if (reminder == "") {
            alert("Please Enter Reminder");
            $("#reminder").focus();
            return;
        }

        if (reminderDate == "") {
            alert("Please Select Date");
            $("#date").focus();
            return;
        }

        const reminderData = {
            userId: currentUser.id,
            reminder,
            reminderDate,
            repeat
        };

        // ADD

        if (editId == null) {

            $.ajax({

                url: API,
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify(reminderData),

                success: function () {

                    $("form")[0].reset();
                    $("#repeat").val("none");

                    Render_UI();

                }

            });

        }

        // UPDATE

        else {

            $.ajax({

                url: `${API}/${editId}`,
                method: "PUT",
                contentType: "application/json",

                data: JSON.stringify(reminderData),

                success: function () {

                    editId = null;

                    $("button[type='submit']").html(`
                        <i class="bi bi-plus-circle"></i>
                        Add Reminder
                    `);

                    $("form")[0].reset();
                    $("#repeat").val("none");

                    Render_UI();

                }

            });

        }

    });


    // =================== RENDER ======================

    function Render_UI() {

        $.get(API, function (res) {

            const data = res.filter(item => item.userId == currentUser.id);

            if (data.length == 0) {

                $("#reminderData").html("<h3>No Reminder Found</h3>");
                return;

            }

            let table = `
            <table>

                <thead>

                    <tr>

                        <th style="display:none;">ID</th>
                        <th>Sr No</th>
                        <th>Reminder</th>
                        <th>Date</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody>
            `;

            data.forEach((el, index) => {

                table += `

                <tr>

                    <td style="display:none;">${el.id}</td>

                    <td>${index + 1}</td>

                    <td>${el.reminder}</td>

                    <td>${el.reminderDate}</td>


                    <td>

                        <button class="editBtn">
                            <i class="bi bi-pencil-fill"></i> Edit
                        </button>

                        <button class="deleteBtn">
                            <i class="bi bi-trash-fill"></i> Delete
                        </button>

                    </td>

                </tr>

                `;

            });

            table += `

                </tbody>

            </table>

            `;

            $("#reminderData").html(table);

        });

    }


    // ================= EDIT ===================

    $(document).on("click", ".editBtn", function () {

        const id = $(this).closest("tr").find("td:first").text();

        $.get(`${API}/${id}`, function (data) {

            editId = id;

            $("#reminder").val(data.reminder);
            $("#date").val(data.reminderDate);
            $("#repeat").val(data.repeat);

            $("button[type='submit']").html(`
                <i class="bi bi-check-circle"></i>
                Update Reminder
            `);

        });

    });


    // ================= DELETE =================

    $(document).on("click", ".deleteBtn", function () {

        if (!confirm("Delete this reminder?")) return;

        const id = $(this).closest("tr").find("td:first").text();

        $.ajax({

            url: `${API}/${id}`,
            method: "DELETE",

            success: function () {

                Render_UI();

            }

        });

    });


    Render_UI();

});
</script>
</html>
