<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
      <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <link rel="stylesheet" href="../Css/Signup.css">
      <style>
      #userData {
        display: none;
      }
      table {
        border: 2px inset gray;
      }

      td,
      th {
        border: 1px outset gray;
      }
    </style>
</head>
<body>
      <form>
        <h1>Create Your Account</h1>
      <label for="username">Username</label>
     <input type="text" name="User_Name" placeholder="Please enter username" id="username">
     <span id="name_error" style="color:red"></span>

      <label for="email">Email</label>
      <input type="text" name="User_Email" id="useremail" placeholder="Please enter your email">
      <span id="email_error" style="color:red"></span>

      <label for="password">Password</label>
      <input type="password" name="User_Password" id="userpassword" placeholder="Enter your password">
      <span id="password_error" style="color:red"></span>

      <label for="contact">Contact</label>
      <input type="tel" name="User_Contact" id="contact" placeholder="Please enter your number">
      <span id="phone_error" style="color:red"></span>
      <button type="submit" value="Sign Up" class="btn" id="sign-up-btn">submit</button>
    
      <div class="login_link">
        <p>Already have an account?</p>
        <a href="login.html">Login Now</a>
      </div>
    </form>
    <div id="userData"></div>
</body>
 <script>
    $(function () {
      const API = `https://expenses-tracker-ccfm.onrender.com/users`;

      // this is for post the data Post  client to server [POST]

      $('form').submit(function (e) {
        e.preventDefault();
        const name = $('#username').val();
        const email = $('#useremail').val();
        const password = $('#userpassword').val();
        const phone = $('#contact').val().trim();

        let isValid = true;

        // Username Validation
        if (name === "") {
            $("#name_error").text("Please enter username.");
            isValid = false;
        }

        // Email Validation
        if (email === "") {
            $("#email_error").text("Please enter email.");
            isValid = false;
        } else if (email.indexOf("@") <= 0) {
            $("#email_error").text("Email must contain @");
            isValid = false;
        } else if (
            email.charAt(email.length - 4) !== "." &&
            email.charAt(email.length - 3) !== "."
        ) {
            $("#email_error").text("Invalid email.");
            isValid = false;
        }

         // Password Validation
        if (password === "") {
            $("#password_error").text("Please enter password.");
            isValid = false;
        } else if (password.length < 8 || password.length > 20) {
            $("#password_error").text("Password must be 8-20 characters.");
            isValid = false;
        } else {
            let hasUpper = /[A-Z]/.test(password);
            let hasLower = /[a-z]/.test(password);
            let hasNumber = /[0-9]/.test(password);
            let hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);

            if (!hasUpper) {
                $("#password_error").text("Must contain one uppercase letter.");
                isValid = false;
            } else if (!hasLower) {
                $("#password_error").text("Must contain one lowercase letter.");
                isValid = false;
            } else if (!hasNumber) {
                $("#password_error").text("Must contain one number.");
                isValid = false;
            } else if (!hasSpecial) {
                $("#password_error").text("Must contain one special character.");
                isValid = false;
            }
        }

        // Phone Validation
        if (phone === "") {
            $("#phone_error").text("Please enter phone number.");
            isValid = false;
        } else if (!/^[6-9]\d{9}$/.test(phone)) {
            $("#phone_error").text("Enter valid 10-digit mobile number.");
            isValid = false;
        }

        if (!isValid) return;
       

        const userData = {
          name : name,
          email: email,
          password: password,
          phone : phone

        };

        $.get(API, function (users) {

    const userExists = users.find(user => user.email === email);

    if (userExists) {
        alert("Email already exists. Please login.");

        return;
      }
      
      $.ajax({
        url: API,
        method: 'POST',
        data: JSON.stringify(userData),
        contentType: 'application/json',
        success: function (data) {
          alert('Congratulations , your account created successfully✅');

          console.log(data);

          window.location.href = "login.html";
        },
        error: function (err) {
          console.log('error', err);
          alert("signup failed❌");
        },
        complete: function () {
          console.log('done');
        },
      });
   });
   

      });
    });
  </script>

</html>
