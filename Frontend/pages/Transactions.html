<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions</title>

<link rel="stylesheet" href="../Css/Transactions.css">
<link rel="stylesheet" href="../Components/SideBar.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>
<div id="sidebar"></div>
<div class="main">
    <div class="header">

        <div>
            <h2>Transactions</h2>
            <p>Manage all your income and expenses</p>
        </div>

    </div>

    <div class="toolbar">

        <div class="filterButtons">

            <button class="active" id="allBtn">All</button>

            <button id="incomeBtn">Income</button>

            <button id="expenseBtn">Expense</button>

        </div>

        <div class="rightFilters">

            <div class="searchBox">

                <i class="fa fa-search"></i>

                <input
                type="text"
                id="search"
                placeholder="Search transaction">

            </div>

            <input type="date" id="dateFilter">

            <select id="sort">

                <option value="">Sort</option>

                <option value="latest">Latest</option>

                <option value="oldest">Oldest</option>

                <option value="high">Highest Amount</option>

                <option value="low">Lowest Amount</option>

            </select>

        </div>

    </div>

    <div class="tableContainer">

        <table>

            <thead>

                <tr>
                    <th>Date</th>

                    <th>Title</th>

                    <th>Category</th>

                    <th>Type</th>

                    <th>Account</th>

                    <th>Amount</th>

                    <th>Remarks</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="tbody">

            </tbody>

        </table>
        <div id="empty">

            <i class="fa-regular fa-folder-open"></i>

            <h3>No Transactions Found</h3>

        </div>

    </div>
    <div class="pagination">

        <button id="prev">
            <i class="fa fa-angle-left"></i>
        </button>

        <span id="pageNo">1</span>

        <button id="next">
            <i class="fa fa-angle-right"></i>
        </button>

    </div>

</div>

<!-- Edit Modal -->

<div class="modal" id="editModal">

    <div class="modalContent">
        <div class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
        </div>

        <h2 id="modalTitle">Edit Transaction</h2>
<p id="modalSubTitle"></p>

        <form id="editForm">
            <label id="titleLabel">Title</label>
<input type="text" id="title">

          <label>Amount</label>
<input type="number" id="amount">

<label>Date</label>
<input type="date" id="date">

<label>Note</label>
<textarea id="remarks"></textarea>

           <label id="categoryLabel">Category</label>

<div id="categoryContainer"></div>

<input type="hidden" id="category">

           <label id="accountLabel">Account</label>

<div class="account">

<div class="account-card" data-value="Cash">

<i class="fa-solid fa-wallet"></i>

<h4>Cash</h4>

</div>

<div class="account-card" data-value="Bank">

<i class="fa-solid fa-building-columns"></i>

<h4>Bank</h4>

</div>

</div>

<input type="hidden" id="account">


            <div class="modalBtns">

                <button
                type="button"
                id="cancel">

                    Cancel

                </button>

                <button
                type="submit">

                    Update

                </button>

            </div>

        </form>

    </div>

</div>



</body>
<script>

const incomeAPI = "https://expenses-tracker-ccfm.onrender.com/income";
const expenseAPI = "https://expenses-tracker-ccfm.onrender.com/expenses";

const currentUser = JSON.parse(localStorage.getItem("loggedInUser"));

let transactions = [];
let filteredData = [];

let currentPage = 1;
const rowsPerPage = 8;

let editId = null;
let editType = "";

//==============================
// Sidebar
//==============================

$("#sidebar").load("../Components/Sidebar.html", function () {

    $("#dash").click(() => location.href = "../index.html");
    $("#income").click(() => location.href = "Income.html");
    $("#expense").click(() => location.href = "Expenses.html");
    $("#transaction").click(() => location.href = "Transactions.html");
    $("#reminderPage").click(() => location.href = "Reminder.html");

    $("#logout").click(function () {

        localStorage.removeItem("loggedInUser");
        location.href = "Login.html";

    });

});
$(".fa-arrow-left").click(function(){
        history.back();
    });

$(".account-card").click(function(){

    $(".account-card").removeClass("active");

$(`.account-card[data-value="${item.account}"]`)
.addClass("active");

    $(this).addClass("active");

    $("#account").val($(this).data("value"));

});

const incomeCategory = [

{
name:"Salary",
icon:"fa-briefcase",
color:"green"
},

{
name:"Freelance",
icon:"fa-laptop-code",
color:"blue"
},

{
name:"Investment",
icon:"fa-chart-line",
color:"sky"
},

{
name:"Gift",
icon:"fa-gift",
color:"purple"
},

{
name:"Bonus",
icon:"fa-coins",
color:"orange"
}

];

const expenseCategory=[

{
name:"Food",
icon:"fa-utensils",
color:"orange"
},

{
name:"Travel",
icon:"fa-plane",
color:"sky"
},

{
name:"Shopping",
icon:"fa-bag-shopping",
color:"purple"
},

{
name:"Health",
icon:"fa-notes-medical",
color:"blue"
},

{
name:"Bills",
icon:"fa-file-invoice-dollar",
color:"green"
}

];

function renderCategory(type){

let data = type==="Income"
? incomeCategory
: expenseCategory;

$("#categoryContainer").empty();

data.forEach(item=>{

$("#categoryContainer").append(`

<div class="icon ${item.color}"
data-value="${item.name}">

<i class="fa-solid ${item.icon}"></i>

<span>${item.name}</span>

</div>

`);

});

}

$(document).on("click",".icon",function(){
$(".icon").removeClass("selected");

$(`.icon[data-value="${item.category}"]`)
.addClass("selected");

$(this).addClass("selected");

$("#category").val($(this).data("value"));

});
//==============================
// Load Transactions
//==============================

function loadTransactions() {

    $.when(

        $.get(incomeAPI),
        $.get(expenseAPI)

    ).done(function (incomeRes, expenseRes) {

        let income = incomeRes[0];
        let expense = expenseRes[0];

        income = income
            .filter(item => item.userId == currentUser.id)
            .map(item => ({
                ...item,
                type: "Income"
            }));

        expense = expense
            .filter(item => item.userId == currentUser.id)
            .map(item => ({
                ...item,
                type: "Expense"
            }));

        transactions = [...income, ...expense];

        transactions.sort((a, b) => new Date(b.date) - new Date(a.date));

        filteredData = [...transactions];

        currentPage = 1;

        renderTable();

    });

}

loadTransactions();

//==============================
// Render Table
//==============================

function renderTable() {

    $("#tbody").empty();

    const start = (currentPage - 1) * rowsPerPage;
    const end = start + rowsPerPage;

    const pageData = filteredData.slice(start, end);

    if (pageData.length === 0) {

        $("#empty").show();
        return;

    }

    $("#empty").hide();

    pageData.forEach(item => {

        const badge = item.type === "Income"

            ? `<span class="incomeTag">Income</span>`

            : `<span class="expenseTag">Expense</span>`;

        $("#tbody").append(`

<tr>

<td>${item.date}</td>

<td>${item.title}</td>

<td>${item.category}</td>

<td>${badge}</td>

<td>${item.account}</td>
<td class="${item.type === 'Income' ? 'incomeAmount' : 'expenseAmount'}">
    ₹${Number(item.amount).toLocaleString("en-IN")}
</td>

<td>${item.note || item.remarks || "-"}</td>

<td>

<button class="editBtn"
data-id="${item.id}"
data-type="${item.type}">

<i class="fa fa-pen"></i>

</button>

<button class="deleteBtn"
data-id="${item.id}"
data-type="${item.type}">

<i class="fa fa-trash"></i>

</button>

</td>

</tr>

`);

    });

    $("#pageNo").text(currentPage);

}
//==============================
// Search
//==============================

$("#search").on("keyup", function () {

    let value = $(this).val().toLowerCase().trim();

    filteredData = transactions.filter(item => {

        return (

            item.title.toLowerCase().includes(value) ||

            item.category.toLowerCase().includes(value) ||

            item.account.toLowerCase().includes(value)

        );

    });

    currentPage = 1;

    renderTable();

});

//==============================
// Date Filter
//==============================

$("#dateFilter").change(function () {

    let date = $(this).val();

    if (date === "") {

        filteredData = [...transactions];

    } else {

        filteredData = transactions.filter(item => item.date === date);

    }

    currentPage = 1;

    renderTable();

});

//==============================
// Type Filter
//==============================

$("#allBtn").click(function () {

    $(".filterButtons button").removeClass("active");

    $(this).addClass("active");

    filteredData = [...transactions];

    currentPage = 1;

    renderTable();

});

$("#incomeBtn").click(function () {

    $(".filterButtons button").removeClass("active");

    $(this).addClass("active");

    filteredData = transactions.filter(item => item.type === "Income");

    currentPage = 1;

    renderTable();

});

$("#expenseBtn").click(function () {

    $(".filterButtons button").removeClass("active");

    $(this).addClass("active");

    filteredData = transactions.filter(item => item.type === "Expense");

    currentPage = 1;

    renderTable();

});

//==============================
// Sort
//==============================

$("#sort").change(function () {

    let sortValue = $(this).val();

    switch (sortValue) {

        case "latest":

            filteredData.sort((a, b) => new Date(b.date) - new Date(a.date));

            break;

        case "oldest":

            filteredData.sort((a, b) => new Date(a.date) - new Date(b.date));

            break;

        case "high":

            filteredData.sort((a, b) => Number(b.amount) - Number(a.amount));

            break;

        case "low":

            filteredData.sort((a, b) => Number(a.amount) - Number(b.amount));

            break;

    }

    currentPage = 1;

    renderTable();

});

//==============================
// Pagination
//==============================

$("#next").click(function () {

    if (currentPage * rowsPerPage < filteredData.length) {

        currentPage++;

        renderTable();

    }

});

$("#prev").click(function () {

    if (currentPage > 1) {

        currentPage--;

        renderTable();

    }

});
//==============================
// Delete
//==============================

$(document).off("click", ".deleteBtn");

$(document).on("click", ".deleteBtn", function () {

    let id = $(this).data("id");
    let type = $(this).data("type");

    if (!confirm("Delete Transaction?")) return;

    let api = (type === "Income") ? incomeAPI : expenseAPI;

    $.ajax({

        url: `${api}/${id}`,
        method: "DELETE",

        success: function () {

            transactions = transactions.filter(item =>
                !(item.id == id && item.type == type)
            );

            filteredData = filteredData.filter(item =>
                !(item.id == id && item.type == type)
            );

            renderTable();

        },

        error: function (err) {

            console.log(err);

        }

    });

});

//==============================
// Open Edit
//==============================

$(document).off("click", ".editBtn");

$(document).on("click",".editBtn",function(){

    editId=$(this).data("id");
    editType=$(this).data("type");

    let item=transactions.find(x=>
        x.id==editId &&
        x.type==editType
    );

    if(!item) return;

    if(editType=="Income"){

        $("#modalTitle").text("Edit Income");
        $("#modalSubTitle").text("Update your income details");
        $("#titleLabel").text("Income Title");
        $("#accountLabel").text("Source Account");
        $("#categoryLabel").text("Income Category");

        renderCategory("Income");

    }
    else{

        $("#modalTitle").text("Edit Expense");
        $("#modalSubTitle").text("Update your expense details");
        $("#titleLabel").text("Expense Title");
        $("#accountLabel").text("Select Account");
        $("#categoryLabel").text("Expense Category");

        renderCategory("Expense");

    }

    $("#title").val(item.title);
    $("#amount").val(item.amount);
    $("#date").val(item.date);
    $("#remarks").val(item.note || "");

    $("#category").val(item.category);

    $(".icon").removeClass("selected");

    $(`.icon[data-value="${item.category}"]`).addClass("selected");

    $("#account").val(item.account);

    $(".account-card").removeClass("active");

    $(`.account-card[data-value="${item.account}"]`).addClass("active");

    $("#editModal").addClass("show");

});

//==============================
// Close Modal
//==============================

$("#cancel").click(function () {

    $("#editModal").removeClass("show");

});

//==============================
// Update
//==============================

$("#editForm").submit(function (e) {

    e.preventDefault();

    if ($("#title").val().trim() === "") {

        alert("Title Required");
        return;

    }

    if ($("#amount").val() <= 0) {

        alert("Invalid Amount");
        return;

    }

    let obj = {

        title: $("#title").val().trim(),
        amount: Number($("#amount").val()),
        date: $("#date").val(),
        category: $("#category").val().trim(),
        account: $("#account").val().trim(),
        note: $("#remarks").val().trim(),
        userId: currentUser.id

    };

    let api = (editType === "Income") ? incomeAPI : expenseAPI;

    $.ajax({

        url: `${api}/${editId}`,
        method: "PUT",
        contentType: "application/json",
        data: JSON.stringify(obj),

        success: function () {

            $("#editModal").removeClass("show");

            loadTransactions();

        },

        error: function (err) {

            console.log(err);

        }

    });

});

</script>
</html>
