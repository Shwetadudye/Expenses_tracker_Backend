<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions</title>

<link rel="stylesheet" href="../Css/Transactions.css">
<link rel="stylesheet" href="../Components/SideBar.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>

<!-- Sidebar -->
<div id="sidebar"></div>

<!-- Main -->
<div class="main">

    <!-- Heading -->

    <div class="header">

        <div>
            <h2>Transactions</h2>
            <p>Manage all your income and expenses</p>
        </div>

        <button class="exportBtn">
            <i class="fa-solid fa-download"></i>
            Export
        </button>

    </div>

    <!-- Filters -->

    <div class="toolbar">

        <div class="filterButtons">

            <button class="active" id="allBtn">All</button>

            <button id="incomeBtn">Income</button>

            <button id="expenseBtn">Expense</button>

        </div>

        <div class="rightFilters">

            <div class="searchBox">

                <i class="fa fa-search"></i>

                <input
                type="text"
                id="search"
                placeholder="Search transaction">

            </div>

            <input type="date" id="dateFilter">

            <select id="sort">

                <option value="">Sort</option>

                <option value="latest">Latest</option>

                <option value="oldest">Oldest</option>

                <option value="high">Highest Amount</option>

                <option value="low">Lowest Amount</option>

            </select>

        </div>

    </div>

    <!-- Table -->

    <div class="tableContainer">

        <table>

            <thead>

                <tr>

                    <th><input type="checkbox"></th>

                    <th>Date</th>

                    <th>Title</th>

                    <th>Category</th>

                    <th>Type</th>

                    <th>Account</th>

                    <th>Amount</th>

                    <th>Remarks</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="tbody">

                <!-- Render Using JQuery -->

            </tbody>

        </table>

        <!-- Empty -->

        <div id="empty">

            <i class="fa-regular fa-folder-open"></i>

            <h3>No Transactions Found</h3>

        </div>

    </div>

    <!-- Pagination -->

    <div class="pagination">

        <button id="prev">
            <i class="fa fa-angle-left"></i>
        </button>

        <span id="pageNo">1</span>

        <button id="next">
            <i class="fa fa-angle-right"></i>
        </button>

    </div>

</div>

<!-- Edit Modal -->

<div class="modal" id="editModal">

    <div class="modalContent">

        <h2>Edit Transaction</h2>

        <form id="editForm">

            <input
            type="text"
            id="title"
            placeholder="Title"
            required>

            <input
            type="number"
            id="amount"
            placeholder="Amount"
            required>

            <input
            type="date"
            id="date"
            required>

            <input
            type="text"
            id="category"
            placeholder="Category">

            <input
            type="text"
            id="account"
            placeholder="Account">

            <textarea
            id="remarks"
            placeholder="Remarks">
            </textarea>

            <select id="type">

                <option value="income">Income</option>

                <option value="expense">Expense</option>

            </select>

            <div class="modalBtns">

                <button
                type="button"
                id="cancel">

                    Cancel

                </button>

                <button
                type="submit">

                    Update

                </button>

            </div>

        </form>

    </div>

</div>

<script src="../Js/Transactions.js"></script>

</body>
<script>
    //==============================
// API
//==============================

const API =`https://expenses-tracker-ccfm.onrender.com/transactions`; 

const incomeAPI = "https://expenses-tracker-ccfm.onrender.com/income";
const expenseAPI = "https://expenses-tracker-ccfm.onrender.com/expenses";

const currentUser = JSON.parse(localStorage.getItem("loggedInUser"));

let transactions = [];
let filteredData = [];

let currentPage = 1;
const rowsPerPage = 8;

let editId = null;
let editType = "";

//==============================
// Sidebar
//==============================

$("#sidebar").load("../Components/Sidebar.html", function () {

    $("#dash").click(() => location.href = "Home.html");
    $("#income").click(() => location.href = "Income.html");
    $("#expense").click(() => location.href = "Expenses.html");
    $("#transaction").click(() => location.href = "Transactions.html");
    $("#reminderPage").click(() => location.href = "Reminder.html");

});

//==============================
// Load Data
//==============================

function loadTransactions() {

    $.when(

        $.get(incomeAPI),
        $.get(expenseAPI)

    ).done(function (incomeRes, expenseRes) {

        let income = incomeRes[0];
        let expense = expenseRes[0];

        income = income
            .filter(x => x.userId == currentUser.id)
            .map(x => ({
                ...x,
                type: "Income"
            }));

        expense = expense
            .filter(x => x.userId == currentUser.id)
            .map(x => ({
                ...x,
                type: "Expense"
            }));

        transactions = [...income, ...expense];

        transactions.sort((a, b) => new Date(b.date) - new Date(a.date));

        filteredData = [...transactions];

        renderTable();

    });

}

loadTransactions();

//==============================
// Render
//==============================

function renderTable() {

    $("#tbody").empty();

    const start = (currentPage - 1) * rowsPerPage;

    const end = start + rowsPerPage;

    const pageData = filteredData.slice(start, end);

    if (pageData.length == 0) {

        $("#empty").show();

        return;

    }

    $("#empty").hide();

    pageData.forEach(item => {

        let badge = item.type == "Income"
            ? "<span class='incomeTag'>Income</span>"
            : "<span class='expenseTag'>Expense</span>";

        $("#tbody").append(`

<tr>

<td>
<input type="checkbox">
</td>

<td>${item.date}</td>

<td>${item.title}</td>

<td>${item.category}</td>

<td>${badge}</td>

<td>${item.account}</td>

<td>₹${Number(item.amount).toLocaleString("en-IN")}</td>

<td>${item.remarks || "-"}</td>

<td>

<button class="editBtn"
data-id="${item.id}"
data-type="${item.type}">

<i class="fa fa-pen"></i>

</button>

<button class="deleteBtn"
data-id="${item.id}"
data-type="${item.type}">

<i class="fa fa-trash"></i>

</button>

</td>

</tr>

`);

    });

    $("#pageNo").text(currentPage);

}

//==============================
// Search
//==============================

$("#search").on("keyup", function () {

    let value = $(this).val().toLowerCase();

    filteredData = transactions.filter(item =>

        item.title.toLowerCase().includes(value) ||

        item.category.toLowerCase().includes(value) ||

        item.account.toLowerCase().includes(value)

    );

    currentPage = 1;

    renderTable();

});

//==============================
// Date Filter
//==============================

$("#dateFilter").change(function () {

    let date = $(this).val();

    if (date == "") {

        filteredData = [...transactions];

    } else {

        filteredData = transactions.filter(x => x.date == date);

    }

    currentPage = 1;

    renderTable();

});

//==============================
// Type Filter
//==============================

$("#allBtn").click(function () {

    $(".filterButtons button").removeClass("active");

    $(this).addClass("active");

    filteredData = [...transactions];

    renderTable();

});

$("#incomeBtn").click(function () {

    $(".filterButtons button").removeClass("active");

    $(this).addClass("active");

    filteredData = transactions.filter(x => x.type == "Income");

    renderTable();

});

$("#expenseBtn").click(function () {

    $(".filterButtons button").removeClass("active");

    $(this).addClass("active");

    filteredData = transactions.filter(x => x.type == "Expense");

    renderTable();

});

//==============================
// Sort
//==============================

$("#sort").change(function () {

    let value = $(this).val();

    if (value == "latest") {

        filteredData.sort((a, b) => new Date(b.date) - new Date(a.date));

    }

    if (value == "oldest") {

        filteredData.sort((a, b) => new Date(a.date) - new Date(b.date));

    }

    if (value == "high") {

        filteredData.sort((a, b) => b.amount - a.amount);

    }

    if (value == "low") {

        filteredData.sort((a, b) => a.amount - b.amount);

    }

    renderTable();

});

//==============================
// Pagination
//==============================

$("#next").click(function () {

    if (currentPage * rowsPerPage < filteredData.length) {

        currentPage++;

        renderTable();

    }

});

$("#prev").click(function () {

    if (currentPage > 1) {

        currentPage--;

        renderTable();

    }

});

//==============================
// Delete
//==============================

$(document).on("click", ".deleteBtn", function () {

   const id = $(this).closest('tr').find('td:first').text();

    if (!confirm("Delete Transaction?")) return;

    let api = type == "Income" ? incomeAPI : expenseAPI;

    $.ajax({

        url: `${API}/${id}`,

        method: "DELETE",

        success: function () {

            loadTransactions();

        }

    });

});

//==============================
// Open Edit
//==============================

$(document).on("click", ".editBtn", function () {

    editId = $(this).data("id");

    editType = $(this).data("type");

    let item = transactions.find(x => x.id == editId && x.type == editType);

    $("#title").val(item.title);
    $("#amount").val(item.amount);
    $("#date").val(item.date);
    $("#category").val(item.category);
    $("#account").val(item.account);
    $("#remarks").val(item.remarks);
    $("#type").val(item.type.toLowerCase());

    $("#editModal").fadeIn();

});

//==============================
// Close Modal
//==============================

$("#cancel").click(function () {

    $("#editModal").fadeOut();

});

//==============================
// Update
//==============================

$("#editForm").submit(function (e) {

    e.preventDefault();

    if ($("#title").val().trim() == "") {

        alert("Title Required");

        return;

    }

    if ($("#amount").val() <= 0) {

        alert("Invalid Amount");

        return;

    }

    let obj = {

        title: $("#title").val(),

        amount: Number($("#amount").val()),

        date: $("#date").val(),

        category: $("#category").val(),

        account: $("#account").val(),

        remarks: $("#remarks").val(),

        userId: currentUser.id

    };

    let api = editType == "Income"
        ? incomeAPI
        : expenseAPI;

    $.ajax({

        url: `${api}/${editId}`,

        method: "PUT",

        contentType: "application/json",

        data: JSON.stringify(obj),

        success: function () {

            $("#editModal").fadeOut();

            loadTransactions();

        }

    });

});

//==============================
// Export CSV
//==============================

$(".exportBtn").click(function () {

    let csv = "Date,Title,Category,Type,Account,Amount,Remarks\n";

    filteredData.forEach(item => {

        csv += `${item.date},${item.title},${item.category},${item.type},${item.account},${item.amount},${item.remarks}\n`;

    });

    let blob = new Blob([csv], {
        type: "text/csv"
    });

    let link = document.createElement("a");

    link.href = URL.createObjectURL(blob);

    link.download = "Transactions.csv";

    link.click();

});
</script>
</html>
